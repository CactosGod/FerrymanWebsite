<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ferryman Hat Co. — Lost between worlds</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #11110f; color: #f3eee4;
      font-family: "Inter", Arial, sans-serif; text-align: center; padding: 24px;
    }
    .rune { font-size: 44px; opacity: .8; }
    h1 { font-family: "Cinzel", Georgia, serif; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; font-size: 20px; margin: 18px 0 8px; }
    p { color: rgba(243,238,228,.6); font-size: 14px; margin: 0 0 26px; }
    a {
      display: inline-block; border: 1px solid rgba(243,238,228,.4); color: #f3eee4;
      text-decoration: none; text-transform: uppercase; letter-spacing: .14em;
      font-size: 11px; padding: 12px 26px;
    }
    a:hover { background: #f3eee4; color: #11110f; }
  </style>
</head>
<body>
  <main>
    <div class="rune" aria-hidden="true">ᛉ</div>
    <h1>This page never crossed the river</h1>
    <p>The page you were looking for does not exist — but the hats do.</p>
    <a href="/">Back to the shore</a>
  </main>
</body>
</html>
